<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Art archive by neverdiephil.">
  <title>neverdiephil — art</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="page-noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#top" aria-label="Back to top">
      <span class="brand-dot"></span>
      <span>NEVERDIEPHIL</span>
      <span class="brand-muted">/ ART</span>
    </a>

    <div class="header-right">
      <span id="workCount" class="work-count">46 WORKS</span>
      <a class="external-link"
         href="https://www.deviantart.com/neverdiephil"
         target="_blank"
         rel="noopener noreferrer">
        DEVIANTART <span aria-hidden="true">↗</span>
      </a>
    </div>
  </header>

  <main id="top">
    <section class="gallery-shell" aria-label="Artwork gallery">
      <div id="gallery" class="gallery" aria-live="polite"></div>
    </section>
  </main>

  <div class="edge-fade edge-fade-top" aria-hidden="true"></div>
  <div class="edge-fade edge-fade-bottom" aria-hidden="true"></div>

  <div class="scroll-hint" aria-hidden="true">
    <span>SCROLL</span>
    <i></i>
  </div>

  <button id="backToTop" class="back-to-top" type="button" aria-label="Back to top">↑</button>

  <dialog id="lightbox" class="lightbox">
    <button class="lightbox-close" type="button" aria-label="Close artwork">×</button>
    <div class="lightbox-stage">
      <img id="lightboxImage" alt="">
    </div>
    <div class="lightbox-meta">
      <div>
        <p class="lightbox-kicker">ARTWORK</p>
        <h2 id="lightboxTitle"></h2>
      </div>
      <a id="lightboxLink" href="#" target="_blank" rel="noopener noreferrer">
        VIEW ON DEVIANTART <span aria-hidden="true">↗</span>
      </a>
    </div>
  </dialog>

  <noscript>
    <p class="noscript">JavaScript is required to load this gallery from DeviantArt.</p>
  </noscript>

  <script src="artworks.js"></script>
  <script src="main.js"></script>
</body>
</html>
