name: Restore Neverdie archive assets

on:
  push:
    paths:
      - '.transfer/main.css.gz.b64'
      - '.github/workflows/restore-neverdie.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct CSS and recover exact assets
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          import html
          import re
          import sys
          import urllib.parse
          import urllib.request
          from collections import deque
          from pathlib import Path

          root = Path("neverdie1")
          root.mkdir(exist_ok=True)

          encoded = Path(".transfer/main.css.gz.b64").read_text().strip()
          css = gzip.decompress(base64.b64decode(encoded))
          css_hash = hashlib.sha256(css).hexdigest()
          expected_css = "bbd282071b0d5d7e45d66be561c5824e32581c91b041febecffbaf3b01e5328c"
          if css_hash != expected_css:
              raise SystemExit(f"CSS checksum mismatch: {css_hash}")
          (root / "main.css").write_bytes(css)

          wanted = {
              "e06ce9f3f3cdb953a24989052e0fe6fd80c18f01a60a285b6818c12867bd127b": "resources/fonts/crucifixion.otf",
              "a0154557219c78d5fa8b0df04ad8801979180f67d2db819da5c3dbb4ed05751a": "resources/fonts/roll-accurate.ttf",
              "419036476f1f15ddb352d13569b1ee9d36817eb8ae495795f55d9bc8ef77e0bf": "resources/images/icon.png",
              "9797e67c6217872b084296609bbd39d1ff5d187651a6c1905b305e7f3bc24202": "resources/images/lightning-1.png",
              "5fb3910d8cf3f42c251bcae0589eb63db0d653d98222290c143a57fefa04af96": "resources/images/lightning-2.png",
              "7af2fa02f9a0f95d0f20703ab5fc79e03fd4395b04f18409ea70382daffa22da": "resources/images/spark.png",
              "8d53ac15b9eff50bd3061acae7e4dd3964f5846c65e4bbff92aae647297b7a53": "resources/video/background.mp4",
          }
          found = {}

          start = "https://neverdiephil.com/"
          host = urllib.parse.urlparse(start).netloc.lower()
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; NeverdieArchive/1.0)",
              "Accept": "*/*",
          }
          queue = deque([
              start,
              "https://neverdiephil.com/wp-content/themes/neverdietwentyfour/res/spark.png",
              "https://neverdiephil.com/wp-content/themes/neverdietwentyfour/res/sparks.png",
              "https://neverdiephil.com/wp-content/themes/neverdietwentyfour/res/lightning-1.png",
              "https://neverdiephil.com/wp-content/themes/neverdietwentyfour/res/lightning-2.png",
              "https://neverdiephil.com/wp-content/themes/neverdietwentyfour/res/lightning1.png",
              "https://neverdiephil.com/wp-content/themes/neverdietwentyfour/res/lightning2.png",
              "https://neverdiephil.com/wp-content/themes/neverdietwentyfour/res/lightning_1.png",
              "https://neverdiephil.com/wp-content/themes/neverdietwentyfour/res/lightning_2.png",
          ])
          seen = set()
          allowed_text = {"text/html", "text/css", "application/javascript", "text/javascript"}
          asset_ext = {".css",".js",".png",".jpg",".jpeg",".gif",".webp",".svg",".woff",".woff2",".ttf",".otf",".eot",".mp4",".webm",".mov",".ico"}

          def add_url(raw, base):
              raw = html.unescape(raw.strip().strip("'\""))
              if not raw or raw.startswith(("data:", "mailto:", "javascript:", "#")):
                  return
              if raw.startswith("//"):
                  raw = "https:" + raw
              u = urllib.parse.urljoin(base, raw)
              p = urllib.parse.urlparse(u)
              if p.scheme not in {"http", "https"} or p.netloc.lower() != host:
                  return
              clean = urllib.parse.urlunparse((p.scheme,p.netloc,p.path,p.params,p.query,""))
              ext = Path(p.path.lower()).suffix
              if clean == start or ext in asset_ext:
                  if ext == ".png":
                      print("PNG CANDIDATE", clean)
                  queue.append(clean)

          def discover(text, base):
              for m in re.finditer(r'''(?is)(?:src|href|poster)\s*=\s*["']([^"']+)["']''', text):
                  add_url(m.group(1), base)
              for m in re.finditer(r'''(?is)url\(\s*([^\)]+?)\s*\)''', text):
                  add_url(m.group(1), base)
              for m in re.finditer(r'''(?is)srcset\s*=\s*["']([^"']+)["']''', text):
                  for part in m.group(1).split(","):
                      add_url(part.strip().split()[0], base)
              for m in re.finditer(r'''(?is)["']([^"']+\.(?:png|jpe?g|gif|webp|svg|woff2?|ttf|otf|eot|mp4|webm|mov|ico)(?:\?[^"']*)?)["']''', text):
                  add_url(m.group(1), base)
              for m in re.finditer(r'''https?://[^\s"'<>\)]+''', text):
                  add_url(m.group(0), base)

          while queue and len(seen) < 1000 and len(found) < len(wanted):
              url = queue.popleft()
              if url in seen:
                  continue
              seen.add(url)
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read(110 * 1024 * 1024)
                      ctype = resp.headers.get_content_type()
                      final_url = resp.geturl()
              except Exception as exc:
                  print(f"skip {url}: {exc}")
                  continue

              digest = hashlib.sha256(data).hexdigest()
              if digest in wanted and digest not in found:
                  rel = wanted[digest]
                  dest = root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
                  found[digest] = final_url
                  print(f"matched {rel} <- {final_url}")

              path_ext = Path(urllib.parse.urlparse(final_url).path.lower()).suffix
              if ctype in allowed_text or path_ext in {".css", ".js"} or final_url == start:
                  try:
                      text = data.decode("utf-8", errors="ignore")
                      discover(text, final_url)
                  except Exception:
                      pass

          missing = [rel for digest, rel in wanted.items() if digest not in found]
          if missing:
              print("Scanned URLs:", len(seen))
              print("Missing exact assets:")
              for rel in missing:
                  print(" -", rel)
              raise SystemExit(2)

          print("All exact ZIP assets recovered and checksum-verified.")

      - name: Commit archive
        run: |
          set -euo pipefail
          rm -rf .transfer
          rm -f .github/workflows/restore-neverdie.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete Neverdie Phil landing page archive"
          git push
